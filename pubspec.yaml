name: jxl_ffi
description: Flutter FFI plugin wrapping libjxl 0.12.0 for JPEG XL encode/decode on Windows and Linux.
version: 0.1.0
homepage: https://github.com/AMDphreak/jxl_ffi
repository: https://github.com/AMDphreak/jxl_ffi
issue_tracker: https://github.com/AMDphreak/jxl_ffi/issues
topics:
  - jpeg-xl
  - jxl
  - ffi
  - image
  - flutter

environment:
  sdk: ^3.12.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true